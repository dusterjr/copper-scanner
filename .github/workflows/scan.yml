name: Copper scan

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 UTC; GitHub sometimes starts scheduled runs late
  workflow_dispatch: {}    # the "Run workflow" button, for a scan right now

permissions:
  contents: write          # lets the scan save its results back to the repo

concurrency:
  group: copper-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - name: Install
        run: pip install -q -r scanner/requirements.txt

      - name: Scan Kalshi and send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEEKDAY_ALERTS: ${{ vars.WEEKDAY_ALERTS }}
          WEEKDAY_THRESHOLD: ${{ vars.WEEKDAY_THRESHOLD }}
          DISPLAY_TZ: ${{ vars.DISPLAY_TZ }}
        run: python scanner/scan.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Nothing new to save"; exit 0; fi
          git commit -q -m "Scan $(date -u +'%Y-%m-%d %H:%M') UTC"
          for attempt in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 10
          done
          echo "Couldn't save results" && exit 1
